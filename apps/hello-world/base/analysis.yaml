apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate-check
spec:
  metrics:
  - name: internal-health-check
    interval: 5s
    failureLimit: 1
    provider:
      job:
        spec:
          template:
            spec:
              containers:
              - name: test-curl
                image: curlimages/curl:latest
                command: ["curl", "-f", "http://dev-hello-world-service.dev.svc.cluster.local"]
              restartPolicy: Never
